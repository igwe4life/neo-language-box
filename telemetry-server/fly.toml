# fly.toml app configuration file generated for neo-language-box-telemetry on 2026-11-06T12:58:23+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'neo-language-box-telemetry'
primary_region = 'iad'

[build]
[env]
  TELEMETRY_DB = '/data/telemetry.db'
  TELEMETRY_PACKS_DIR = '/data/packs'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
