<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000">
<title>Scan to listen</title>
<style>
  /* Designed to look right on a projector or a big screen at the back of a
     room: everything scales to the viewport, high contrast, no chrome. */
  :root { color-scheme: dark; }
  html, body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    background: #000; color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  h1 { font-size: clamp(28px, 4vw, 56px); margin: 0 0 20px; font-weight: 700; letter-spacing: .5px; }
  .sub { font-size: clamp(18px, 2vw, 26px); color: #a8a8a8; margin: 0 0 40px; text-align: center; padding: 0 24px; }
  .card {
    background: #fff; padding: 28px; border-radius: 24px;
    box-shadow: 0 20px 60px rgba(255,255,255,0.08);
  }
  .card svg { display: block; width: min(60vh, 60vw); height: auto; }
  .url {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    font-size: clamp(16px, 2vw, 22px);
    background: #101010; padding: 12px 24px; border-radius: 999px;
    margin-top: 36px; letter-spacing: .5px;
  }
  .hint { color: #7a7a7a; margin-top: 20px; font-size: clamp(13px, 1.4vw, 16px); text-align: center; }
</style>
</head>
<body>
  <h1>Scan to listen</h1>
  <div class="sub">Point your phone camera at this code.<br>The Sermon Listener app will open and connect automatically.</div>
  <div class="card">{{QR_SVG}}</div>
  <div class="url">{{URL}}</div>
  <div class="hint">All phones must be on the same Wi-Fi as this laptop.</div>
</body>
</html>
