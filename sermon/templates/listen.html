<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000">
<title>Neo Sermon</title>
<style>
  :root {
    --bg: #000;
    --fg: #f2f2f2;
    --muted: #6a6a6a;
    --accent: #7cc4ff;
    --accent-strong: #2b8dff;
    --pill-bg: rgba(255, 255, 255, 0.06);
    --pill-border: rgba(255, 255, 255, 0.12);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100vh; overflow: hidden;
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
  }
  body {
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }

  /* Top language chips - a HORIZONTALLY scrolling strip, not a wrapping grid.
     With up to 14 languages, wrapping onto several rows pushed the
     visualiser/caption down with no way to scroll back up to the rest - this
     avoids that entirely rather than needing a scroll fix for it. */
  #top {
    display: flex; align-items: center; gap: 10px; z-index: 1;
    padding: 14px 44px 6px 12px;
    overflow-x: auto; overflow-y: hidden; flex-wrap: nowrap;
    scrollbar-width: none; -ms-overflow-style: none;
    -webkit-overflow-scrolling: touch;
    mask-image: linear-gradient(to right, transparent 0, #000 16px, #000 calc(100% - 16px), transparent 100%);
  }
  #top::-webkit-scrollbar { display: none; }
  .chip {
    background: var(--pill-bg); color: var(--fg);
    border: 1px solid var(--pill-border); border-radius: 999px;
    padding: 8px 18px; font-size: 15px; font-weight: 600;
    letter-spacing: .5px; cursor: pointer; user-select: none;
    display: inline-flex; align-items: center; gap: 6px;
    flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
  }
  .chip.on {
    background: var(--accent-strong); border-color: var(--accent-strong);
    color: #fff;
  }
  .chip .flag { font-size: 17px; }
  .chip .check { display: none; font-size: 13px; }
  .chip.on .check { display: inline; }
  #mute {
    position: absolute; top: 12px; right: 12px; z-index: 2;
    background: transparent; border: none; color: var(--muted);
    font-size: 22px; padding: 8px; cursor: pointer;
  }
  #mute.on { color: var(--accent); }
  #report-btn {
    position: absolute; top: 14px; right: 58px; z-index: 2;
    background: transparent; border: none; color: var(--muted);
    font-size: 19px; padding: 8px; cursor: pointer; line-height: 1;
  }
  #status {
    position: absolute; top: 22px; left: 20px; z-index: 2;
    width: 8px; height: 8px; border-radius: 50%;
    background: #b93a3a; box-shadow: 0 0 8px currentColor;
  }
  #status.live { background: #35c46c; }

  /* Center: visualiser */
  #stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  canvas#viz {
    width: 100%; max-width: 620px; height: 260px;
    display: block;
  }

  /* Bottom: current translation only */
  #caption {
    padding: 22px 22px calc(28px + env(safe-area-inset-bottom));
    text-align: center; line-height: 1.35;
    font-size: clamp(22px, 6.5vw, 34px);
    font-weight: 500;
    min-height: 28vh;
    transition: opacity 0.35s ease;
  }
  #caption.dim { opacity: 0.35; }
  #caption.empty {
    color: var(--muted); font-style: italic;
    font-size: clamp(16px, 4.5vw, 22px); font-weight: 400;
  }

  /* First-tap gate - full-screen language pick + audio unlock.

     With up to 14 languages, the grid can be taller than a phone screen.
     justify-content:flex-start (not center) plus overflow-y:auto on the gate
     itself is the outer safety net; .langgroup additionally scrolls WITHIN
     its own bounded height so the brand/subtitle/Start-button stay in view
     and only the language grid scrolls - avoids a fixed-height section ever
     hiding a language with no way to reach it. */
  #gate {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column;
    align-items: center; justify-content: flex-start; gap: 22px;
    padding: calc(36px + env(safe-area-inset-top)) 24px
             calc(28px + env(safe-area-inset-bottom));
    background: radial-gradient(circle at 50% 40%, #142238 0%, #000 80%);
    text-align: center;
    overflow-y: auto;
  }
  #gate.hidden { display: none; }
  #gate .brand {
    font-size: 22px; font-weight: 600; letter-spacing: .4px;
    color: #fff; flex-shrink: 0;
  }
  #gate .sub {
    color: var(--muted); font-size: 15px; max-width: 320px; line-height: 1.5;
    flex-shrink: 0;
  }
  #gate .langgroup {
    display: flex; gap: 14px; flex-wrap: wrap; justify-content: center;
    max-height: 48vh; overflow-y: auto; width: 100%; max-width: 480px;
    padding: 6px; align-content: flex-start;
  }
  #gate .langgroup::-webkit-scrollbar { width: 6px; }
  #gate .langgroup::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 6px; }
  #gate .chip { padding: 14px 26px; font-size: 17px; }
  #gate .go { flex-shrink: 0; }
  #gate .go {
    background: var(--accent-strong); color: white; border: none;
    border-radius: 999px; padding: 18px 40px;
    font-size: 18px; font-weight: 700; letter-spacing: .5px;
    cursor: pointer; opacity: 0.5; pointer-events: none;
    box-shadow: 0 8px 28px rgba(43, 141, 255, 0.35);
    transition: opacity 0.2s;
  }
  #gate .go.ready {
    opacity: 1; pointer-events: auto;
    animation: pulse-glow 2s infinite;
  }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 8px 28px rgba(43, 141, 255, 0.35); }
    50%      { box-shadow: 0 8px 46px rgba(43, 141, 255, 0.85); }
  }

  .hidden { display: none !important; }

  /* -------- report sheet (item 4) -------- */
  #report-sheet {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,0.6); backdrop-filter: blur(2px);
    display: flex; align-items: flex-end; justify-content: center;
  }
  .report-card {
    width: 100%; max-width: 420px;
    background: #111; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px 20px 0 0;
    padding: 22px 20px calc(18px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px;
  }
  .report-title {
    color: #fff; font-size: 16px; font-weight: 700; text-align: center;
    margin-bottom: 4px;
  }
  .report-opt {
    background: rgba(255,255,255,0.06); color: var(--fg);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 12px;
    padding: 15px; font-size: 15px; font-weight: 600; cursor: pointer;
    text-align: center;
  }
  .report-opt:active { background: rgba(255,255,255,0.14); }
  .report-cancel {
    background: transparent; color: var(--muted); border: none;
    padding: 12px; font-size: 14px; cursor: pointer; margin-top: 4px;
  }
  #report-toast {
    position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    background: rgba(34, 197, 94, 0.95); color: #06220f;
    padding: 12px 20px; border-radius: 999px; font-size: 14px; font-weight: 700;
    z-index: 210; box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    transition: opacity .25s, transform .25s;
  }
  #report-toast.toast-off { opacity: 0; transform: translateX(-50%) translateY(10px); pointer-events: none; }
</style>
</head>
<body>

<div id="gate">
  <div class="brand">Neo Sermon</div>
  <div class="sub">Pick a language.<br>The translation will play automatically as the speaker talks.</div>
  <!-- Chips are built from the language list the server advertises, so a
       language whose model failed to load is never offered. -->
  <div class="langgroup" id="gate-langs"></div>
  <button class="go" id="gate-go">Start listening</button>
</div>

<div id="status" aria-label="connection"></div>
<button id="report-btn" aria-label="report an issue" title="Report an issue">⚑</button>
<button id="mute" class="on" aria-label="mute">🔊</button>

<div id="top"></div>

<div id="stage"><canvas id="viz"></canvas></div>

<div id="caption" class="empty">waiting for the speaker…</div>

<!-- Report sheet (item 4): one tap to report, no form to fill in. -->
<div id="report-sheet" class="hidden">
  <div class="report-card">
    <div class="report-title">Report an issue</div>
    <button class="report-opt" data-type="translation">Wrong translation</button>
    <button class="report-opt" data-type="audio">No / bad audio</button>
    <button class="report-opt" data-type="technical">Technical issue</button>
    <button class="report-opt" data-type="other">Something else</button>
    <button class="report-cancel" id="report-cancel">Cancel</button>
  </div>
</div>
<div id="report-toast" class="toast-off">Thanks - reported to the operator</div>

<script>
"use strict";

// ---------------------------------------------------------------- storage
const store = {
  get: (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch { return d; } },
  set: (k, v) => { try { localStorage.setItem(k, String(v)); } catch {} },
};
let lang    = store.get("lang", "");     // no default - forces first pick
let voiceOn = store.get("voice", "1") === "1";

// ---------------------------------------------------------- DOM shortcuts
const $ = id => document.getElementById(id);
const gate      = $("gate");
const gateGo    = $("gate-go");
const gateBox   = $("gate-langs");
const topBox    = $("top");
let   gateLangs = [];        // rebuilt when the server tells us its languages
let   topLangs  = [];
const muteBtn   = $("mute");
const statusDot = $("status");
const caption   = $("caption");
const stage     = $("stage");
const viz       = $("viz");
const vctx      = viz.getContext("2d");

// --------------------------------------------------- language list + chips
// Populated from the welcome message. Until then we have no chips, which is
// correct: we must not offer a language the server cannot produce.
let LANGS = {};          // code -> {native, flag, speech, rtl, voice}
let LANG_ORDER = [];

function buildLangChips() {
  const mk = (code, label) => {
    const m = LANGS[code] || {};
    const b = document.createElement("button");
    b.className = "chip";
    b.dataset.lang = code;
    const f = document.createElement("span");
    f.className = "flag";
    f.textContent = m.flag || "";
    b.appendChild(f);
    b.appendChild(document.createTextNode(label));
    // Extra, unambiguous "this one is selected" marker beyond just colour -
    // readable even for a colour-blind listener or in bright sunlight.
    const chk = document.createElement("span");
    chk.className = "check";
    chk.textContent = "✓";
    b.appendChild(chk);
    return b;
  };
  gateBox.innerHTML = "";
  topBox.innerHTML = "";
  // English is the source language, not a translation - the room already
  // hears it live, so it is not offered as something to pick here. It stays
  // in LANGS/LANG_ORDER (the operator's own dashboard still shows it), this
  // just skips it when building the listener-facing chips.
  LANG_ORDER.forEach(code => {
    const m = LANGS[code] || {};
    if (m.source) return;
    gateBox.appendChild(mk(code, m.native || code.toUpperCase()));
    topBox.appendChild(mk(code, code.toUpperCase()));
  });
  gateLangs = Array.from(gateBox.querySelectorAll(".chip"));
  topLangs = Array.from(topBox.querySelectorAll(".chip"));
  gateLangs.forEach(b => b.addEventListener("click", () => {
    setLang(b.dataset.lang, /*live*/ false);
  }));
  topLangs.forEach(b => b.addEventListener("click", () => {
    setLang(b.dataset.lang, /*live*/ true);
  }));
  // A language remembered from a previous service may no longer be offered.
  if (lang && !LANGS[lang]) { lang = ""; store.set("lang", ""); }
  paintLangs();
}

function setLang(next, live) {
  const old = lang;
  lang = next;
  store.set("lang", lang);
  paintLangs();
  applyDirection();
  reportLang();
  if (live && old !== lang) {
    if (currentMessage) applyMessage(currentMessage, /*speak*/ false);
    stopPlayback();
  }
}

// Arabic reads right-to-left; without this the caption renders with its
// punctuation and any embedded latin words in the wrong places.
function applyDirection() {
  const rtl = !!(LANGS[lang] && LANGS[lang].rtl);
  caption.dir = rtl ? "rtl" : "ltr";
  caption.style.textAlign = rtl ? "right" : "";
}

// Tell the server which language we are on, so it only synthesises audio
// somebody is actually listening to.
function reportLang() {
  if (!lang || !ws || ws.readyState !== 1) return;
  try { ws.send(JSON.stringify({ type: "lang", lang: lang })); } catch {}
}

// ------------------------------------------------------ language painting
function paintLangs() {
  gateLangs.forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  topLangs .forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  gateGo.classList.toggle("ready", !!lang);
}
function paintMute() {
  muteBtn.textContent = voiceOn ? "🔊" : "🔇";
  muteBtn.classList.toggle("on", voiceOn);
}
paintLangs(); paintMute();

muteBtn.addEventListener("click", () => {
  voiceOn = !voiceOn; store.set("voice", voiceOn ? "1" : "0"); paintMute();
  if (!voiceOn) stopPlayback();
});

// ------------------------------------------------------ report an issue (item 4)
// One tap, no form: speed matters more than detail for someone glancing at
// their phone mid-service. The operator sees type + timestamp + which
// language the listener was on, which is usually enough to act on.
const reportSheet = $("report-sheet");
const reportToast = $("report-toast");
let reportToastTimer = null;

$("report-btn").addEventListener("click", () => reportSheet.classList.remove("hidden"));
$("report-cancel").addEventListener("click", () => reportSheet.classList.add("hidden"));
reportSheet.addEventListener("click", e => {
  if (e.target === reportSheet) reportSheet.classList.add("hidden");
});
reportSheet.querySelectorAll(".report-opt").forEach(btn => {
  btn.addEventListener("click", async () => {
    const type = btn.dataset.type;
    reportSheet.classList.add("hidden");
    try {
      const qs = new URLSearchParams({ type, lang: lang || "" });
      await fetch("/api/report?" + qs.toString(), { method: "POST" });
    } catch { /* best effort - the operator losing one report is not worth
                 blocking the listener's experience over */ }
    reportToast.classList.remove("toast-off");
    clearTimeout(reportToastTimer);
    reportToastTimer = setTimeout(() => reportToast.classList.add("toast-off"), 2600);
  });
});

// ------------------------------------------------------ first-tap gate
gateGo.addEventListener("click", () => {
  if (!lang) return;
  primeAudio();       // audio + TTS unlock in the same user gesture
  gate.classList.add("hidden");
  // Only paint the "waiting" placeholder if we haven't already received a
  // translation while the gate was up (which can happen if the WS connects
  // fast). Otherwise we'd blank out live content.
  if (!currentMessage) paintCaption("", /*empty*/ true);
});

// ----------------------------------------------------- canvas visualiser
// Two states:
//   idle:    a gentle breathing dot in the center
//   playing: live waveform of the current audio through an AnalyserNode
let audioCtx = null;
let analyser = null;
let sourceNode = null;
let vizFrame = null;
let breathing = true;

function resizeCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = viz.clientWidth || 300;
  const h = viz.clientHeight || 240;
  viz.width = Math.round(w * dpr);
  viz.height = Math.round(h * dpr);
  vctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function drawIdle(t) {
  const w = viz.clientWidth, h = viz.clientHeight;
  vctx.clearRect(0, 0, w, h);
  const cx = w / 2, cy = h / 2;
  const r0 = Math.min(w, h) * 0.05;
  const pulse = (Math.sin(t / 700) + 1) / 2;      // 0..1
  vctx.fillStyle = `rgba(124, 196, 255, ${0.08 + pulse * 0.15})`;
  vctx.beginPath(); vctx.arc(cx, cy, r0 + pulse * 8, 0, Math.PI * 2); vctx.fill();
  vctx.fillStyle = `rgba(124, 196, 255, ${0.45 + pulse * 0.3})`;
  vctx.beginPath(); vctx.arc(cx, cy, r0, 0, Math.PI * 2); vctx.fill();
}

function drawWave() {
  const w = viz.clientWidth, h = viz.clientHeight;
  vctx.clearRect(0, 0, w, h);
  if (!analyser) return;
  const buf = new Float32Array(analyser.fftSize);
  analyser.getFloatTimeDomainData(buf);
  const cx = w / 2, cy = h / 2;
  vctx.strokeStyle = "#7cc4ff";
  vctx.lineWidth = 2.5;
  vctx.beginPath();
  const step = Math.max(1, Math.floor(buf.length / w));
  for (let x = 0; x < w; x++) {
    const s = buf[Math.min(buf.length - 1, x * step)];
    const y = cy + s * (h * 0.4);
    if (x === 0) vctx.moveTo(x, y); else vctx.lineTo(x, y);
  }
  vctx.stroke();

  // Level-driven halo
  let sum = 0;
  for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
  const rms = Math.sqrt(sum / buf.length);
  const glow = Math.min(1, rms * 6);
  vctx.fillStyle = `rgba(43, 141, 255, ${0.05 + glow * 0.25})`;
  vctx.beginPath(); vctx.arc(cx, cy, 12 + glow * 60, 0, Math.PI * 2); vctx.fill();
}

function vizLoop(t) {
  if (breathing) drawIdle(t); else drawWave();
  vizFrame = requestAnimationFrame(vizLoop);
}
vizFrame = requestAnimationFrame(vizLoop);

// -------------------------------------------------------- caption
function paintCaption(text, empty) {
  caption.classList.toggle("empty", !!empty);
  caption.textContent = text || (empty ? "waiting for the speaker…" : "");
  caption.classList.remove("dim");
}

// -------------------------------------------------------- audio playback
let currentAudio = null;
let currentMessage = null;
let awaitingAudioFor = null;      // id of a sentence whose clip is still synthesising
let audioWaitTimer = null;
const AUDIO_WAIT_MS = 6000;       // give up waiting, use the browser voice
const audioQueue = [];
const MAX_QUEUE = 2;

function primeAudio() {
  // Unlock both HTMLAudioElement autoplay AND Web Speech in the same gesture
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch {}
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
  if ("speechSynthesis" in window) {
    try {
      const u = new SpeechSynthesisUtterance(" ");
      u.volume = 0; speechSynthesis.speak(u);
    } catch {}
  }
}

function stopPlayback() {
  audioQueue.length = 0;
  if (currentAudio) {
    try { currentAudio.pause(); } catch {}
    currentAudio = null;
  }
  if ("speechSynthesis" in window) { try { speechSynthesis.cancel(); } catch {} }
  breathing = true;
  disconnectAnalyser();
}

function connectAnalyser(mediaEl) {
  if (!audioCtx) return;
  try {
    if (sourceNode) { try { sourceNode.disconnect(); } catch {} }
    sourceNode = audioCtx.createMediaElementSource(mediaEl);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    sourceNode.connect(analyser);
    analyser.connect(audioCtx.destination);
    breathing = false;
  } catch (err) {
    // If it fails (e.g. cross-origin), still play; just no waveform
    breathing = true;
  }
}
function disconnectAnalyser() {
  if (analyser) { try { analyser.disconnect(); } catch {} analyser = null; }
  if (sourceNode) { try { sourceNode.disconnect(); } catch {} sourceNode = null; }
}

function enqueue(msg) {
  currentMessage = msg;
  applyMessage(msg, /*speak*/ voiceOn);
}

function applyMessage(msg, speak) {
  const text = msg[lang] || "";
  const audioUrl = msg["audio_" + lang];
  paintCaption(text || "(no translation)", !text);
  // A newer sentence supersedes any clip we were still waiting on; without
  // this the old fallback timer could fire and speak stale text.
  clearTimeout(audioWaitTimer);
  awaitingAudioFor = null;
  if (!speak) return;
  // English is what the room is already hearing out loud. Speaking it back
  // through the phone would echo the preacher a few seconds late.
  if (LANGS[lang] && LANGS[lang].source) return;

  if (audioUrl) {
    playServerAudio(audioUrl);
    return;
  }
  // The server sends text as soon as it has it and the spoken clip a moment
  // later. If ours is still being synthesised, wait for it rather than
  // speaking the same sentence twice in two different voices.
  const pending = Array.isArray(msg.audio_pending) && msg.audio_pending.includes(lang);
  if (pending) {
    awaitingAudioFor = msg.id;
    clearTimeout(audioWaitTimer);
    // If synthesis dies outright, don't leave the listener in silence.
    audioWaitTimer = setTimeout(() => {
      if (awaitingAudioFor === msg.id) {
        awaitingAudioFor = null;
        if ("speechSynthesis" in window && text) playTTS(text);
      }
    }, AUDIO_WAIT_MS);
    return;
  }
  if ("speechSynthesis" in window && text) playTTS(text);
}

// Second-stage message: clips for a sentence whose text already arrived.
function applyAudioMessage(msg) {
  if (!currentMessage || msg.id !== currentMessage.id) return;   // stale
  currentMessage["audio_" + lang] = msg["audio_" + lang];
  delete currentMessage.audio_pending;
  if (awaitingAudioFor !== msg.id) return;
  awaitingAudioFor = null;
  clearTimeout(audioWaitTimer);
  if (!voiceOn) return;
  const url = msg["audio_" + lang];
  if (url) playServerAudio(url);
  else if ("speechSynthesis" in window && (currentMessage[lang] || ""))
    playTTS(currentMessage[lang]);           // synthesis failed server-side
}

function playServerAudio(url) {
  audioQueue.push(url);
  while (audioQueue.length > MAX_QUEUE) audioQueue.shift();
  drainAudio();
}
function drainAudio() {
  if (currentAudio) return;
  const url = audioQueue.shift();
  if (!url) { breathing = true; disconnectAnalyser(); return; }
  const audio = new Audio(url);
  audio.crossOrigin = "anonymous";     // needed for MediaElementSource on same-origin too on some browsers
  audio.preload = "auto";
  currentAudio = audio;
  connectAnalyser(audio);
  const done = () => {
    if (currentAudio !== audio) return;
    currentAudio = null;
    breathing = true; disconnectAnalyser();
    drainAudio();
  };
  audio.addEventListener("ended", done, { once: true });
  audio.addEventListener("error", done, { once: true });
  const p = audio.play();
  if (p && typeof p.then === "function") p.catch(() => done());
}

function playTTS(text) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    // BCP-47 tag for the phone's own voice. Was hardcoded to fr/es; with nine
    // targets a wrong tag makes the phone read e.g. Russian with a French
    // voice, which is unintelligible.
    u.lang = (LANGS[lang] && LANGS[lang].speech) || lang;
    u.rate = 1;
    breathing = true;     // no analyser hook for Web Speech
    speechSynthesis.speak(u);
  } catch {}
}

// -------------------------------------------------------- websocket
let ws = null;
let reconnectDelay = 500;
function setDot(live) { statusDot.classList.toggle("live", !!live); }

function receive(msg) {
  if (msg.type === "welcome") {
    // The server is authoritative about which languages exist.
    if (msg.languages && Array.isArray(msg.targets)) {
      LANGS = msg.languages;
      LANG_ORDER = msg.targets.filter(c => LANGS[c]);
      buildLangChips();
      applyDirection();
      reportLang();
    }
    // Take only the most recent, if any - no history feed
    if (Array.isArray(msg.history) && msg.history.length) {
      const last = msg.history[msg.history.length - 1];
      currentMessage = last;
      applyMessage(last, /*speak*/ false);
      caption.classList.add("dim");    // it's stale
    }
    return;
  }
  if (msg.type === "translation") enqueue(msg);
  else if (msg.type === "audio") applyAudioMessage(msg);
}

function connect() {
  const proto = location.protocol === "https:" ? "wss:" : "ws:";
  const url = proto + "//" + location.host + "/ws";
  try { ws = new WebSocket(url); } catch { scheduleReconnect(); return; }
  // Re-announce our language on every (re)connect: after a reconnect the
  // server has no record of it, and would stop synthesising our audio.
  ws.addEventListener("open", () => { setDot(true); reconnectDelay = 500; reportLang(); });
  ws.addEventListener("close", () => { setDot(false); scheduleReconnect(); });
  ws.addEventListener("error", () => { try { ws.close(); } catch {} });
  ws.addEventListener("message", ev => {
    try { receive(JSON.parse(ev.data)); } catch {}
  });
}
function scheduleReconnect() {
  setTimeout(connect, reconnectDelay);
  reconnectDelay = Math.min(reconnectDelay * 1.6, 5000);
}
connect();

// Keep the screen on
if ("wakeLock" in navigator) {
  const req = () => navigator.wakeLock.request("screen").catch(() => {});
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") req();
  });
  req();
}
</script>
</body>
</html>
