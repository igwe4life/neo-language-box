name: Build macOS app

# Manual only - this downloads multi-GB model assets and runs PyInstaller,
# so it isn't something to fire on every push. See
# scripts/build_models_ship.py for how the models-ship-v1 release asset this
# depends on was produced, and desktop.spec for the mac-specific packaging
# (BUNDLE(), mic-only audio, no WASAPI loopback).
#
# GitHub retired Intel macOS hosted hardware entirely (macos-13 queues
# forever - it's gone from the fleet; "macos-14" was never a valid image
# name either - only macos-15-arm64 and macos-26-arm64 exist per
# actions/runner-images' current releases). macos-latest always points at
# whatever current arm64 image that resolves to.
#
# The x86_64 leg below cross-builds for Intel on that same arm64 hardware
# via Rosetta 2 (setup-python's architecture: x64 downloads and runs an
# Intel Python under Rosetta, which GitHub's arm64 runners ship with
# preinstalled for exactly this). This is new/unverified for this
# project - ctranslate2, sherpa-onnx and piper-tts confirmed to still
# publish macOS x86_64 wheels as of the versions requirements.txt pins,
# but onnxruntime's was NOT confirmed (checked from Windows, not a real
# Mac, so inconclusive either way) - --only-binary=:all: makes a missing
# wheel fail fast and clearly here rather than hang trying to build from
# source.
on:
  workflow_dispatch:
    inputs:
      models_release_tag:
        description: "Release tag holding the models-ship zip parts"
        required: false
        default: "models-ship-v1"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            py_arch: arm64
          - arch: x86_64
            py_arch: x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.py_arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --only-binary scoped to just onnxruntime: that's the one
          # dependency whose macOS x86_64 wheel availability is unverified
          # (see the top-of-file note) and we want a clear fast failure on
          # it specifically, not on an unrelated pure-Python package (e.g.
          # pywebview's proxy_tools) that simply has no wheel at all and
          # was never in question.
          pip install --only-binary=onnxruntime -r requirements.txt -r requirements-desktop.txt

      - name: Download and reassemble the model set
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ inputs.models_release_tag }}"
          mkdir -p models-dl
          gh release download "$tag" -R "${{ github.repository }}" \
            -p "models-ship.zip.part-*" -p "models-ship.sha256" -D models-dl
          cat models-dl/models-ship.zip.part-* > models-ship.zip
          declare -a expected=($(cat models-dl/models-ship.sha256))
          actual="$(shasum -a 256 models-ship.zip | awk '{print $1}')"
          if [ "$actual" != "${expected[0]}" ]; then
            echo "sha256 mismatch: expected ${expected[0]}, got $actual" >&2
            exit 1
          fi
          mkdir -p models-ship
          unzip -q models-ship.zip -d models-ship
          ls models-ship/models

      - name: Build the .app with PyInstaller
        run: pyinstaller --clean --noconfirm desktop.spec

      - name: Copy models beside the executable
        run: |
          # Mirrors installer.iss's approach on Windows: models are copied
          # in after the build, not baked in by PyInstaller, so the model
          # set can change without rebuilding the app.
          cp -R models-ship/models "dist/NeoLanguageBox.app/Contents/MacOS/models"

      - name: Build the .dmg
        run: |
          set -euo pipefail
          name="NeoLanguageBoxSetup-mac-${{ matrix.arch }}"
          mkdir -p dmg_root
          cp -R "dist/NeoLanguageBox.app" dmg_root/
          hdiutil create -volname "Neo Language Box" -srcfolder dmg_root \
            -ov -format UDZO "${name}.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: NeoLanguageBoxSetup-mac-${{ matrix.arch }}
          path: NeoLanguageBoxSetup-mac-${{ matrix.arch }}.dmg
          retention-days: 14
