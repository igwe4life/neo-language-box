// App module. Kept small on purpose - one activity, one dependency for QR
// scanning (ZXing embedded), everything else stock AndroidX.

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.sermontranslation.listener'
    compileSdk 34

    defaultConfig {
        applicationId "com.sermontranslation.listener"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    // Build unsigned (sideload). We don't ship to Play Store, so no signing
    // config needed. The APK will still install once the user allows
    // "Install unknown apps" for their browser / file manager.
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    // Self-contained QR scanner activity (no Google Play Services dependency)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
